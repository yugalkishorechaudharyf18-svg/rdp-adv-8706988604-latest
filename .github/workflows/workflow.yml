name: RDP-Latest
on:
  workflow_dispatch:
    inputs:
      ts_authkey: { required: true }
      telegram_chat_id: { required: false }
      bot_token: { required: false }
permissions: { contents: read, actions: write }
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TS_HOSTNAME: Dev
    steps:
      - name: Cancel Previous Runs
        run: |
          $hdr=@{Authorization="Bearer ${{ github.token }}";Accept="application/vnd.github+json"}
          $runs=Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress" -Headers $hdr
          foreach($r in $runs.workflow_runs){
              if($r.id -ne ${{ github.run_id }}){
                  Invoke-RestMethod -Method POST "https://api.github.com/repos/${{ github.repository }}/actions/runs/$($r.id)/cancel" -Headers $hdr -ErrorAction SilentlyContinue
              }
          }
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Dev"
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
              $dst = "$env:TEMP\tailscale.msi"
              Invoke-WebRequest -Uri $url -OutFile $dst
              Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
              Remove-Item $dst -Force
          }
      - name: Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME"
          $ip = $null; $retries = 0
          while (-not $ip -and $retries -lt 15) {
              $ip = & $ts ip -4 | Select-Object -First 1
              if (-not $ip) { Start-Sleep -Seconds 5; $retries++ }
          }
          if (-not $ip) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
      - name: Create RDP User
        run: |
          $u = "Admin"; $p = "Pass@2026"
          $s = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
              New-LocalUser -Name $u -Password $s -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $u
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          }
      - name: Send Telegram Credentials
        if: always()
        run: |
          $chatId = "${{ inputs.telegram_chat_id }}"
          $botToken = "${{ inputs.bot_token }}"
          $ipAddress = $env:TAILSCALE_IP
          if($ipAddress -and $chatId -and $botToken){
              $cbString = "$ipAddress|Admin|Pass@2026"
              $text = "┌─[ ◈ 𝐑𝐃𝐏 𝐑𝐄𝐀𝐃𝐘 ]───`n│`n│  ›  𝐎𝐒 › Latest`n│  ›  𝐇ᴏꜱᴛ › $env:TS_HOSTNAME`n│  ›  𝐈𝐏 › $ipAddress`n│  ›  𝐒ᴛᴀᴛᴇ › 𝐑𝐔𝐍𝐍𝐈𝐍𝐆`n│`n│  ›  𝐂ᴏɴɴᴇᴄᴛ 𝐓ᴀɪʟꜱᴄᴀʟᴇ`n│  ›  𝐓ʜᴇɴ 𝐂ʟɪᴄᴋ 𝐁ᴇʟᴏᴡ`n│`n└─[ 『𓍼ֶָ֢˖ ࣪ꨄ𝐃⃝𝛆‌֟፝𝛎.་༘࿐』 ]───"
              $inlineKeyboard = ,@( @{ text = "━━━━ ◈ 𝐒ʜᴏᴡ 𝐂ʀᴇᴅꜱ ◈ ━━━━"; callback_data = $cbString } )
              $body = @{ chat_id = $chatId; text = $text; parse_mode = "Markdown"; reply_markup = @{ inline_keyboard = $inlineKeyboard } } | ConvertTo-Json -Depth 10 -Compress
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          }
      - name: Maintain Connection
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active (Dev)"
              Start-Sleep -Seconds 300
          }

      - name: Auto Loop Restart
        if: always()
        run: |
          $hdr=@{{Authorization="Bearer ${{ github.token }}";Accept="application/vnd.github+json"}}
          $url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/workflow.yml/dispatches"
          $body=@{{ref="main"; inputs=@{{ts_authkey="${{ inputs.ts_authkey }}"; telegram_chat_id="${{ inputs.telegram_chat_id }}"; bot_token="${{ inputs.bot_token }}"}}}} | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
